services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - what_to_eat_data:/app/data
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NIM_BASE_URL: ${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NIM_MODEL: ${NIM_MODEL:-meta/llama-3.1-8b-instruct}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  what_to_eat_data:
