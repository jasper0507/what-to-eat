services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - what_to_eat_data:/app/data
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  what_to_eat_data:
