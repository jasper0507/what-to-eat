services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - what_to_eat_data:/app/data
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?set NVIDIA_API_KEY in .env}
      NIM_BASE_URL: ${NIM_BASE_URL:-}
      NIM_MODEL: ${NIM_MODEL:-}
      NIM_TIMEOUT: ${NIM_TIMEOUT:-}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-}
      DISCOVERY_MAX_POOL_SIZE: ${DISCOVERY_MAX_POOL_SIZE:-}
      DISCOVERY_MAX_ELIGIBLE_DISHES: ${DISCOVERY_MAX_ELIGIBLE_DISHES:-}
      DISCOVERY_MIN_REROLLS: ${DISCOVERY_MIN_REROLLS:-}
      DISCOVERY_REQUIRED_SIGNALS: ${DISCOVERY_REQUIRED_SIGNALS:-}
      DISCOVERY_RECENT_MEAL_WINDOW: ${DISCOVERY_RECENT_MEAL_WINDOW:-}
      DISCOVERY_MAX_DISCOVERIES_PER_MEAL: ${DISCOVERY_MAX_DISCOVERIES_PER_MEAL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  what_to_eat_data:
